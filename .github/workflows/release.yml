name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.1.0). Leave empty for a dry-run build with no release upload."
        required: false
        type: string
      windows_trusted_signing_account:
        description: "Azure Trusted Signing account name for Windows artifacts."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,        platform: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,         platform: macos-x64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,    platform: linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      platform: windows-x64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json `packageManager` field;
      # do not pass `version:` here or pnpm/action-setup@v4 errors with
      # ERR_PNPM_BAD_PM_VERSION on the duplicate spec.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (macOS — signed + notarized)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.APPSTORE_CONNECT_KEY_BASE64 }}" | base64 --decode > /tmp/asc-key.p8
          export APPLE_API_KEY_PATH=/tmp/asc-key.p8
          pnpm tauri build --target ${{ matrix.target }}

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles deb,appimage,updater

      - name: Build (Windows — unsigned)
        if: matrix.os == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      # Windows installer signing (Azure Trusted Signing) needs four secrets. If
      # any are absent (e.g. the signing account isn't provisioned yet) the
      # signing action would hard-fail, and because fail-fast is off and the
      # release tolerates a missing platform, the whole Windows leg would drop
      # SILENTLY. Instead, detect the secrets up front: sign when all present,
      # otherwise emit a loud ::warning:: and continue with an UNSIGNED installer.
      # The build above still produced the minisign updater .sig, so auto-update
      # keeps working — only the first-install SmartScreen prompt is affected —
      # and the draft-review gate lets the maintainer decide whether to publish
      # an unsigned Windows build. Signed vs skipped is now explicit in the run.
      - name: Check Windows signing secrets
        id: winsign
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          set -euo pipefail
          if [ -n "$AZ_TENANT" ] && [ -n "$AZ_CLIENT" ] && [ -n "$AZ_SECRET" ] && [ -n "$AZ_PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Azure Trusted Signing secrets present — Windows installers will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Windows installer signing skipped::AZURE_* Trusted Signing secrets are not configured; the Windows .msi/.exe will be UNSIGNED (SmartScreen warns on first install). The minisign updater signature is still produced, so auto-update works. Set AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_CERT_PROFILE to enable installer signing."
          fi

      - name: Sign Windows binaries (Azure Trusted Signing)
        if: matrix.os == 'windows-latest' && steps.winsign.outputs.available == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          trusted-signing-account-name: ${{ github.event.inputs.windows_trusted_signing_account || vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || 'mono-labs' }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Azure signing mutates the installer bytes after Tauri emitted its
      # updater signatures. Refresh those signatures against the final,
      # Authenticode-signed installers so the updater verifies the exact files
      # users download. This is also safe when Azure signing is unavailable: it
      # deterministically replaces the original signatures with equivalent
      # signatures over the unchanged installers.
      - name: Refresh Windows updater signatures after installer signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          signed=0
          while IFS= read -r -d '' installer; do
            rm -f "${installer}.sig"
            pnpm exec tauri signer sign "${installer}"
            test -s "${installer}.sig"
            signed=$((signed + 1))
          done < <(find "$bundle_dir" -type f \( -name '*.exe' -o -name '*.msi' \) -print0)
          test "$signed" -ge 1

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # macOS runners default to bash 3.2 which doesn't support
          # `shopt -s globstar`, so we use `find` for portability.
          # Prefix every asset with the matrix platform. Tauri gives both macOS
          # updater archives the same basename, so flattening unprefixed matrix
          # artifacts would overwrite one architecture in the release job.
          # Normalize the basename with the same character policy GitHub applies
          # to release assets. latest.json can then point at the filename we
          # upload instead of a pre-normalization name that would 404.
          # Tauri 2 emits direct AppImage/NSIS/MSI updater signatures when
          # createUpdaterArtifacts=true; retain those as well as the legacy
          # archive forms so the manifest generator is forward/back compatible.
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          platform="${{ matrix.platform }}"
          find "$bundle_dir" -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.deb' -o -name '*.deb.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.sig' \
               -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \
               -o -name '*.msi' -o -name '*.msi.sig' \
               -o -name '*.msi.zip' -o -name '*.msi.zip.sig' \
               -o -name '*.exe' -o -name '*.exe.sig' \
               -o -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \) \
            -print0 | while IFS= read -r -d '' asset; do
              asset_name=$(basename "$asset" | sed -E 's/[^A-Za-z0-9_-]/./g; s/\.\.+/./g')
              cp -f "$asset" "dist-release/${platform}--${asset_name}"
            done
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist-release/

  release:
    needs: build
    # `!cancelled()` lets this job inspect artifacts even when a matrix leg
    # fails, while still skipping a cancelled run. The manifest guard below
    # requires every supported updater platform, so an incomplete matrix yields
    # a precise failure and can never publish a partial release.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The git tag is a fourth version source: latest.json's version comes from
      # the tag while the built binary reports the in-file version. If they
      # disagree the updater would offer a version the installed app never
      # becomes — a perpetual phantom-update loop. Assert the tag equals the
      # (already three-way-consistent) in-repo version before publishing anything,
      # and fail the release loudly on mismatch. Reuses the version-consistency
      # script (a bare `node` — no install needed).
      - name: Assert release tag matches the in-repo version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/check-versions.mjs "${TAG#v}"

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./artifacts

      # Refuse to cut a release from a fully failed matrix: if every build failed
      # there are no artifacts, and publishing would create an empty draft.
      - name: Require at least one artifact
        run: |
          set -euo pipefail
          count=$(find ./artifacts -type f | wc -l)
          echo "Collected ${count} artifact file(s)."
          if [ "${count}" -eq 0 ]; then
            echo "::error::No build artifacts were produced — every matrix build failed. Refusing to cut a release." >&2
            exit 1
          fi

      # latest.json is the manifest tauri-plugin-updater fetches from
      # the GitHub Releases endpoint configured in tauri.conf.json. It
      # tells the running app which version is current and where to
      # download the signed update bundle from. The pubkey on the
      # device side verifies these signatures against the corresponding
      # private key held in TAURI_SIGNING_PRIVATE_KEY.
      - name: Generate latest.json (updater manifest)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          cd artifacts

          read_sig() {
            # Echo the trimmed contents of $1 if it exists, else empty.
            if [ -f "$1" ]; then
              tr -d '\n\r' < "$1"
            fi
          }

          first_asset() {
            local pattern candidate
            for pattern in "$@"; do
              candidate=$(find . -maxdepth 1 -type f -name "$pattern" -printf '%f\n' | LC_ALL=C sort | head -1)
              if [ -n "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 0
          }

          # Tauri 2 signs the direct AppImage/NSIS/MSI installers. macOS uses
          # the signed .app.tar.gz updater archive. Legacy archive names remain
          # accepted as fallbacks for reproducibility across Tauri patch bumps.
          DARWIN_ARM_BUNDLE=$(first_asset 'macos-arm64--*.app.tar.gz')
          DARWIN_ARM_SIG="${DARWIN_ARM_BUNDLE}.sig"
          DARWIN_X64_BUNDLE=$(first_asset 'macos-x64--*.app.tar.gz')
          DARWIN_X64_SIG="${DARWIN_X64_BUNDLE}.sig"
          LINUX_APPIMAGE_BUNDLE=$(first_asset 'linux-x64--*.AppImage' 'linux-x64--*.AppImage.tar.gz')
          LINUX_APPIMAGE_SIG="${LINUX_APPIMAGE_BUNDLE}.sig"
          LINUX_DEB_BUNDLE=$(first_asset 'linux-x64--*.deb')
          LINUX_DEB_SIG="${LINUX_DEB_BUNDLE}.sig"
          WIN_NSIS_BUNDLE=$(first_asset 'windows-x64--*.exe' 'windows-x64--*.nsis.zip')
          WIN_NSIS_SIG="${WIN_NSIS_BUNDLE}.sig"
          WIN_MSI_BUNDLE=$(first_asset 'windows-x64--*.msi' 'windows-x64--*.msi.zip')
          WIN_MSI_SIG="${WIN_MSI_BUNDLE}.sig"
          WIN_PRIMARY_BUNDLE="${WIN_NSIS_BUNDLE:-$WIN_MSI_BUNDLE}"
          WIN_PRIMARY_SIG="${WIN_PRIMARY_BUNDLE}.sig"

          # Emit both Tauri's legacy os-arch key and its installer-aware
          # os-arch-bundle key. The generic Windows key intentionally prefers
          # NSIS, matching the wallet's user-facing installer.
          PLATFORMS_JSON="{}"
          add_platform() {
            local key="$1" bundle="$2" sig="$3"
            if [ -n "$bundle" ] && [ -s "$sig" ]; then
              local sig_data asset_url
              sig_data=$(read_sig "$sig")
              asset_url=$(jq -rn --arg base "$BASE" --arg name "$bundle" '$base + "/" + ($name | @uri)')
              PLATFORMS_JSON=$(jq \
                --arg k "$key" \
                --arg s "$sig_data" \
                --arg u "$asset_url" \
                '. + {($k): {signature: $s, url: $u}}' \
                <<<"$PLATFORMS_JSON")
            fi
          }

          add_platform "darwin-aarch64" "$DARWIN_ARM_BUNDLE" "$DARWIN_ARM_SIG"
          add_platform "darwin-aarch64-app" "$DARWIN_ARM_BUNDLE" "$DARWIN_ARM_SIG"
          add_platform "darwin-x86_64" "$DARWIN_X64_BUNDLE" "$DARWIN_X64_SIG"
          add_platform "darwin-x86_64-app" "$DARWIN_X64_BUNDLE" "$DARWIN_X64_SIG"
          add_platform "linux-x86_64" "$LINUX_APPIMAGE_BUNDLE" "$LINUX_APPIMAGE_SIG"
          add_platform "linux-x86_64-appimage" "$LINUX_APPIMAGE_BUNDLE" "$LINUX_APPIMAGE_SIG"
          add_platform "linux-x86_64-deb" "$LINUX_DEB_BUNDLE" "$LINUX_DEB_SIG"
          add_platform "windows-x86_64" "$WIN_PRIMARY_BUNDLE" "$WIN_PRIMARY_SIG"
          add_platform "windows-x86_64-nsis" "$WIN_NSIS_BUNDLE" "$WIN_NSIS_SIG"
          add_platform "windows-x86_64-msi" "$WIN_MSI_BUNDLE" "$WIN_MSI_SIG"

          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg n "Monolythium desktop wallet ${TAG}" \
            --argjson p "$PLATFORMS_JSON" \
            '{version: $v, pub_date: $d, notes: $n, platforms: $p}' \
            > latest.json

          echo "=== latest.json ==="
          cat latest.json

          # This release is an all-platform, all-installer candidate. Refuse to
          # publish if any target is absent. Otherwise an installed DEB/MSI/NSIS
          # client could fall back to a generic entry for a different bundle
          # type and reject the downloaded bytes during installation.
          platform_count=$(jq '.platforms | length' latest.json)
          echo "latest.json describes ${platform_count} platform(s)."
          for required in \
            darwin-aarch64 darwin-aarch64-app \
            darwin-x86_64 darwin-x86_64-app \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb \
            windows-x86_64 windows-x86_64-nsis windows-x86_64-msi
          do
            jq -e --arg required "$required" '.platforms[$required].signature | length > 0' latest.json >/dev/null || {
              echo "::error::latest.json is missing signed updater target ${required}." >&2
              exit 1
            }
          done

      # Publish a SHA256SUMS asset so a user can verify any file they download
      # from the release page (integrity — independent of the OS code-signing
      # and the updater's minisign .sig). Checksum every collected file except
      # the sums file itself; quote the name (artifacts contain spaces) and sort
      # for a reproducible list. Runs after latest.json so the manifest is
      # covered too. `sha256sum -c SHA256SUMS` verifies it.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\n' | sort | while IFS= read -r f; do
            sha256sum "$f" >> SHA256SUMS
          done
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # The release is created as a DRAFT on purpose. The maintainer reviews the
      # collected artifacts + the generated latest.json, then manually PUBLISHES
      # the draft as the latest (non-draft, non-prerelease) release. That manual
      # publish is BOTH the human quality gate AND the step that activates
      # auto-update: tauri.conf.json polls
      #   https://github.com/monolythium/desktop-wallet/releases/latest/download/latest.json
      # and GitHub's `releases/latest/download/...` path resolves ONLY to a
      # published, non-prerelease release — a draft (and its assets) is not
      # publicly reachable. So the updater endpoint stays a 404 (surfaced in-app
      # as "up to date") until the draft is published, at which point it resolves
      # the same latest.json filename this job uploaded. Endpoint and publish path
      # therefore agree by construction. To auto-publish on every tag instead
      # (dropping the artifact-review gate — the tag push becomes the only gate),
      # set `draft: false`. See docs/RELEASING.md for the full cut→verify runbook.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ./artifacts/*
          draft: true
          # Auto-populate the body from the commits/PRs since the previous
          # release (GitHub's own generator) so a published release isn't blank.
          # It's real history, not a hand-written changelog; the draft-review
          # gate lets the maintainer curate it before publishing.
          generate_release_notes: true
          fail_on_unmatched_files: false

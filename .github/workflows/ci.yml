name: CI

# Fast PR gate. The multi-OS SIGNED bundle lives in release.yml (tag-triggered);
# this stays single-OS (Linux) and unsigned — it never needs signing secrets.
on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json `packageManager`; do not pass a
      # `version:` here or pnpm/action-setup@v4 errors on the duplicate spec.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # webkit2gtk et al. are needed to compile the Tauri crate for cargo check.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The three version sources (package.json / tauri.conf.json / Cargo.toml)
      # must agree — they drifted once (Cargo.toml lagged a patch).
      - name: Check version consistency
        run: node scripts/check-versions.mjs

      # `pnpm build` is `tsc --noEmit && vite build` — typecheck + build in one,
      # and it produces ../dist which the Rust build script embeds, so it must
      # run before the cargo steps below.
      - name: Typecheck and build
        run: pnpm build

      # Sequential: the repo's forks pool starves under parallel/overlap runs.
      - name: Test
        run: pnpm test --no-file-parallelism

      # cargo check, NOT a full `tauri build` — bundling + signing belong to the
      # release pipeline; the PR gate stays fast and needs no signing secrets.
      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: the JS dependency tree is clean at `high` today (verified at
      # both high and moderate), so block a PR that introduces a high-severity
      # advisory. Lower-severity/dev-only advisories don't fail here.
      - name: pnpm audit (fail on high)
        run: pnpm audit --audit-level high

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Report-first (advisory) during bring-up.
      #  - The blocking vulnerabilities today are RUSTSEC-2026-0194 and
      #    RUSTSEC-2026-0195 (quick-xml, high — DoS). These are REAL and
      #    unaccepted: they are left visible and tracked for a dependency-bump
      #    follow-up, NOT ignored.
      #  - RUSTSEC-2024-0429 (glib VariantStrIter unsoundness) is an accepted
      #    warning — a transitive of the GTK3 stack Tauri needs on Linux, no
      #    upstream fix, not reachable in the wallet's usage — so it is ignored.
      #  - RUSTSEC-2026-0190 (anyhow, unsound) is a non-failing warning also worth
      #    an eventual bump; it stays visible.
      # Promote this step to a hard gate (drop continue-on-error) once quick-xml
      # is remediated and the ignore list is confirmed to cover exactly the
      # accepted set.
      - name: cargo audit (advisory)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo audit --ignore RUSTSEC-2024-0429
